name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Runs on the same branch queue up instead of piling onto the runners. Only pushes to main and manual runs start this workflow,
# so no outside code ever runs on the self-hosted runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: [self-hosted, linux, x64, bloem-linux, "bloem-run-${{ github.run_id }}-${{ github.run_attempt }}", bloem-job-android]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Lint
        run: ./gradlew lintDebug

      - name: Assemble debug and release APKs
        run: ./gradlew assembleDebug assembleRelease

      - name: Verify CI release artifact is unsigned
        run: |
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          if VERIFY_OUTPUT=$("$APKSIGNER" verify app/build/outputs/apk/release/app-release-unsigned.apk 2>&1); then
            echo "CI release artifact unexpectedly contains a valid signature"
            exit 1
          fi
          echo "$VERIFY_OUTPUT" | grep -q "DOES NOT VERIFY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html

      - name: Upload unsigned build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk

  minified-runtime-smoke:
    runs-on: [self-hosted, linux, x64, bloem-linux, "bloem-run-${{ github.run_id }}-${{ github.run_attempt }}", bloem-job-android]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Run release-equivalent runtime smoke
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: ./gradlew connectedMinifiedTestAndroidTest

      - name: Upload minified smoke results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: minified-runtime-smoke-results
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
