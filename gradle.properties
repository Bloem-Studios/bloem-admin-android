# AndroidX support
android.useAndroidX=true

# BuildConfig
org.gradle.jvmargs=-Xmx4g
org.gradle.parallel=true
org.gradle.caching=true

# AGP 8.7.2 was tested up to compileSdk 35; the app builds and tests at 36 (target SDK 36 for Google Play).
# Remove this when the Android Gradle plugin is upgraded to a version tested with compileSdk 36.
android.suppressUnsupportedCompileSdk=36
